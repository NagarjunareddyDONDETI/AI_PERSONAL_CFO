# AI Personal CFO — Docker Compose configuration for local testing & Coolify.
#
# Coolify can automatically deploy this stack. It provisions a FastAPI backend
# (uvicorn) and a Vite/React frontend (nginx reverse proxy), storing data on a
# persistent volume (`cfo-data`).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-cfo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEFAULT_PROVIDER=auto
      - MAX_UPLOAD_SIZE_MB=15
      - MAX_CONCURRENT_ANALYSES=2
      - ENABLE_RAG=false
      - CFO_DATA_DIR=/var/data
      - CFO_DB_PATH=/var/data/cfo.db
      - ALLOWED_ORIGINS=*
      # Required in production — set to a 32+ char secret
      - AUTH_SECRET=${AUTH_SECRET:-change-this-to-a-long-random-secret-in-production-32chars}
      # Optional LLM API keys:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - cfo-data:/var/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-cfo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cfo-data:
    name: ai-cfo-data